name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    # Throwaway servers for the integration tests. The credentials
    # exist only inside the job.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cloude
          POSTGRES_DB: cloude_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cloude
          MYSQL_DATABASE: cloude_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pcloude"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      CLOUDE_TEST_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=cloude_test
      CLOUDE_TEST_PGSQL_USER: postgres
      CLOUDE_TEST_PGSQL_PASS: cloude
      CLOUDE_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=cloude_test
      CLOUDE_TEST_MYSQL_USER: root
      CLOUDE_TEST_MYSQL_PASS: cloude
      CLOUDE_TEST_REDIS_HOST: 127.0.0.1
      CLOUDE_TEST_REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql, pdo_mysql, redis
          ini-values: error_reporting=-1, display_errors=On
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint every PHP file
        run: |
          find src config bin examples tests -type f \( -name '*.php' -o -name 'cloude-test' \) -print0 \
            | xargs -0 -n1 php -l > /tmp/lint.log 2>&1 || { grep -v '^No syntax errors' /tmp/lint.log; exit 1; }

      # Every server the integration tests need is up and ext-redis is
      # installed, so nothing may be skipped: a skip here means a test
      # silently stopped covering PostgreSQL, MySQL or Redis. A
      # deprecation notice fails the job too.
      - name: Run the test suite
        shell: bash
        run: |
          php bin/cloude-test --fail-on-deprecation | tee /tmp/tests.log
          if grep -q 'Skipped:' /tmp/tests.log; then
            echo "::error::Tests were skipped in CI — a service or extension is missing."
            exit 1
          fi

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The oldest supported version: php-cs-fixer then never proposes
      # syntax the minimum PHP cannot parse.
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check code style
        run: composer cs-check
